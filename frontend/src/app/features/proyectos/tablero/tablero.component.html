<div class="card">
    <p-toast></p-toast>

    <div class="flex justify-content-between align-items-center mb-3">
        <div class="flex align-items-center gap-2">
            <button pButton icon="pi pi-arrow-left" class="p-button-text" (click)="goBack()"></button>
            <h5 class="m-0">Tablero</h5>
        </div>
    </div>

    <div class="tablero-columnas" *ngIf="!loading">
        <div class="tablero-columna" *ngFor="let columna of columnas">
            <div class="tablero-columna-header">
                <span>{{ columna.nombre }}</span>
                <button pButton icon="pi pi-plus" class="p-button-text p-button-sm" (click)="openCreate(columna)"></button>
            </div>

            <div
                class="tablero-columna-body"
                cdkDropList
                [id]="columna.id"
                [cdkDropListData]="columna.tareas"
                [cdkDropListConnectedTo]="columnaIds"
                (cdkDropListDropped)="drop($event, columna)">

                <div class="tablero-tarea" *ngFor="let tarea of columna.tareas" cdkDrag>
                    <div class="flex justify-content-between align-items-start">
                        <strong>{{ tarea.titulo }}</strong>
                        <p-tag [value]="tarea.prioridad" [severity]="prioridadSeverity(tarea.prioridad)"></p-tag>
                    </div>
                    <p class="tablero-tarea-descripcion" *ngIf="tarea.descripcion">{{ tarea.descripcion }}</p>
                    <div class="flex justify-content-between align-items-center mt-2">
                        <small>{{ tarea.responsableNombre ?? 'Sin asignar' }}</small>
                        <div>
                            <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="openEdit(tarea)"></button>
                            <button pButton icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" (click)="deleteTarea(tarea)"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-tarea-form
    [(visible)]="formVisible"
    [proyectoId]="proyectoId"
    [columnaId]="columnaDestinoCreacion!"
    [tarea]="tareaEnEdicion"
    (saved)="onSaved()">
</app-tarea-form>
