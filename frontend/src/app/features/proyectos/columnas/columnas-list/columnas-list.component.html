<div class="card">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>

    <div class="flex justify-content-between align-items-center mb-3">
        <div class="flex align-items-center gap-2">
            <button pButton icon="pi pi-arrow-left" class="p-button-text" (click)="goBack()"></button>
            <h5 class="m-0">Columnas</h5>
        </div>
        <button pButton icon="pi pi-plus" label="Nueva columna" (click)="openCreate()"></button>
    </div>

    <p-table [value]="columnas" [loading]="loading" responsiveLayout="scroll">

        <ng-template pTemplate="header">
            <tr>
                <th style="width: 4rem">Orden</th>
                <th>Nombre</th>
                <th style="width: 10rem"></th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-columna let-i="rowIndex">
            <tr>
                <td>{{ columna.orden }}</td>
                <td>{{ columna.nombre }}</td>
                <td>
                    <button pButton icon="pi pi-arrow-up" class="p-button-text p-button-sm" [disabled]="i === 0" (click)="moveUp(i)"></button>
                    <button pButton icon="pi pi-arrow-down" class="p-button-text p-button-sm" [disabled]="i === columnas.length - 1" (click)="moveDown(i)"></button>
                    <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="openEdit(columna)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" (click)="confirmDelete(columna)"></button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="3" class="text-center">No hay columnas.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<app-columna-form
    [(visible)]="formVisible"
    [proyectoId]="proyectoId"
    [columna]="columnaEnEdicion"
    (saved)="onSaved()">
</app-columna-form>
